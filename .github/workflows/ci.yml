name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PESTER_VERSION: '5.8.0'
  PSSCRIPTANALYZER_VERSION: '1.25.0'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PowerShell modules
        id: cache-modules
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-pester${{ env.PESTER_VERSION }}-psa${{ env.PSSCRIPTANALYZER_VERSION }}

      - name: Install Pester and PSScriptAnalyzer
        if: steps.cache-modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force -Scope CurrentUser

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          # tests/manual makes real network/LLM calls (issue #13's live regression
          # suite) and must never run in CI - see tests/manual/*.Tests.ps1 header.
          $config.Run.ExcludePath = '*\manual\*'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path src -Recurse
          $results | Format-Table -AutoSize
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
            Write-Host "##[error]$($errors.Count) PSScriptAnalyzer error(s) found"
            exit 1
          }

  browser:
    # Playwright against src/WebUi.ps1 (launched by playwright.config.ts's webServer).
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --with-deps only installs Linux system packages; Windows needs just the browser.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 14
